<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyCast - Weather Forecast</title>

    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="weather-container">

        <header class="header">
            <h1>SkyCast</h1>
            <p>Your daily weather, beautifully presented.</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input type="text" id="cityInput" placeholder="Enter city name...">

            <button id="searchBtn">Search</button>

        </section>

        <!-- Current Weather -->
        <section class="current-weather">

            <div class="weather-info">

                <h2 id="cityName">Lahore</h2>

                <div class="temperature">
                    <span id="weatherIcon">☀️</span>
                    <h1 id="temperature">28°C</h1>
                </div>

                <p id="weatherCondition">Sunny</p>

            </div>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-card">
                    <h3>Humidity</h3>
                    <p id="humidity">45%</p>
                </div>

                <div class="detail-card">
                    <h3>Wind Speed</h3>
                    <p id="windSpeed">12 km/h</p>
                </div>

                <div class="detail-card">
                    <h3>Feels Like</h3>
                    <p id="feelsLike">30°C</p>
                </div>

            </div>

        </section>

        <!-- 5 Day Forecast -->
        <section class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div class="forecast-container" id="forecastContainer">

                <!-- Forecast cards will be added using JavaScript -->

            </div>

        </section>

    </div>

    <script src="weather.js"></script>

</body>

</html>
