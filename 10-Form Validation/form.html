<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartForm - Registration</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="container">

        <header class="header">

            <div class="logo">
                <h2>SmartForm<span>.</span></h2>
            </div>

            <p>
                Already have an account?
                <a href="#">Sign In</a>
            </p>

        </header>


        <main class="main-content">

            <div class="form-card">

                <div class="form-heading">

                    <h1>Create Your Account</h1>

                    <p>
                        Join us today! Enter your details
                        to create your account.
                    </p>

                </div>


                <form id="registrationForm"
                      novalidate
                      autocomplete="off">

                    <div class="input-group">

                        <label for="fullName">Full Name</label>

                        <input
                            type="text"
                            id="fullName"
                            name="full-name"
                            placeholder="Enter your full name"
                            autocomplete="off"
                        >

                        <small class="error-message" id="nameError"></small>

                    </div>


                    <div class="input-group">

                        <label for="email">Email Address</label>

                        <input
                            type="email"
                            id="email"
                            name="registration-email"
                            placeholder="Enter your email address"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                        >

                        <small class="error-message" id="emailError"></small>

                    </div>


                    <div class="input-group">

                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone-number"
                            placeholder="Enter your phone number"
                            autocomplete="off"
                        >

                        <small class="error-message" id="phoneError"></small>

                    </div>


                    <div class="input-group">

                        <label for="password">Password</label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="password"
                                name="new-password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                            >
                                Show
                            </button>

                        </div>


                        <div class="password-strength">

                            <div class="strength-bar">
                                <span id="strengthBar"></span>
                            </div>

                            <small id="strengthText">
                                Password Strength
                            </small>

                        </div>

                        <small class="error-message" id="passwordError"></small>

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-field">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirm-new-password"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="toggleConfirmPassword"
                            >
                                Show
                            </button>

                        </div>

                        <small class="error-message" id="confirmPasswordError"></small>

                    </div>


                    <div class="terms-group">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        <label for="terms">
                            I agree to the Terms & Conditions
                        </label>

                    </div>

                    <small class="error-message" id="termsError"></small>


                    <button type="submit" class="submit-btn">
                        Create Account
                    </button>


                    <div class="success-message" id="successMessage">
                        Account created successfully!
                    </div>

                </form>

            </div>

        </main>


        <footer class="footer">

            <p>
                © 2026 SmartForm. All Rights Reserved.
            </p>

        </footer>

    </div>


    <script src="form.js"></script>

</body>

</html>
